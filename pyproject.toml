[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocketsim"
version = "0.1.0"
description = "6-DOF gimbaled-thrust rocket simulator: EDF hover testbed, PID vs RL control"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.0", "torch>=2.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
