# Clock + control-loop benchmark monitor.
# Run: openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f monitor.cfg
init
echo "=== CLOCK + CONTROL-LOOP BENCHMARK ==="
for {set i 1} {$i <= 6} {incr i} {
    halt
    set v [read_memory 0x20000000 32 6]
    set tick [lindex $v 1]
    set sws  [lindex $v 2]
    set mhz  [lindex $v 3]
    set cyc  [lindex $v 4]
    set khz  [lindex $v 5]
    set src "HSI"
    if {$sws == 2} { set src "PLL" }
    echo [format "poll %d | clk=%s %d MHz | update=%d cyc | max loop=%d kHz (tick=%d)" \
          $i $src $mhz $cyc $khz $tick]
    resume
    sleep 400
}
shutdown
