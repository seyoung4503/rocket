# Live accelerometer monitor: poll the telemetry block over SWD and print
# WHO_AM_I + X/Y/Z in mg. Tilt the board to watch the gravity vector move.
# Run: openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f monitor.cfg
init

proc s32 {v} { if {$v >= 0x80000000} { return [expr {$v - 0x100000000}] } else { return $v } }

echo "=== ACCELEROMETER (mg) — tilt the board ==="
for {set i 1} {$i <= 20} {incr i} {
    halt
    set v [read_memory 0x20000000 32 6]
    set magic [lindex $v 0]
    set tick  [lindex $v 1]
    set who   [lindex $v 2]
    set x [s32 [lindex $v 3]]
    set y [s32 [lindex $v 4]]
    set z [s32 [lindex $v 5]]
    set name "?"
    if {$who == 0x3F} { set name "LIS3DSH" }
    if {$who == 0x3B} { set name "LIS302DL" }
    echo [format "poll %2d | who=0x%02x %-8s | X=%6d Y=%6d Z=%6d  mg" \
          $i $who $name $x $y $z]
    resume
    sleep 500
}
shutdown
