# Live telemetry monitor: poll the chip's RAM block over SWD and print it.
# Run: openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f monitor.cfg
init
echo "=== LIVE TELEMETRY @0x20000000 (poll | magic | tick | alt_cm) ==="
for {set i 1} {$i <= 10} {incr i} {
    halt
    set v [read_memory 0x20000000 32 3]
    set magic [lindex $v 0]
    set tick  [lindex $v 1]
    set alt   [lindex $v 2]
    set ok "??"
    if {$magic == 0x52434b54} { set ok "TKCR-OK" }
    echo [format "poll %2d | 0x%08x %s | tick=%-5d | alt=%d" $i $magic $ok $tick $alt]
    resume
    sleep 500
}
shutdown
